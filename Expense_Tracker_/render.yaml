services:
  - type: web
    name: expense-tracker
    runtime: docker
    # Persistent disks require a paid Render instance. Use "free" only when
    # temporary demo data is acceptable.
    plan: starter
    healthCheckPath: /api.php?action=session
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: expense-tracker-data
      mountPath: /var/data
      sizeGB: 1